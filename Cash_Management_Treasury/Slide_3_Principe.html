<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; background: #2B6E71; font-family: 'IBM Plex Sans', sans-serif; }
  .header { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: #F6F4EF; opacity: 0.7; text-transform: uppercase; }
  .counter { font-family: 'Space Grotesk', sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #F6F4EF; opacity: 0.85; }
  .content { position: absolute; top: 0; left: 64px; right: 64px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #F6F4EF; opacity: 0.85; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 50px; line-height: 1.3; color: #F6F4EF; margin: 0; max-width: 880px; }
</style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Gisèle Metouck</div>
    <div class="counter">3 / 5</div>
  </div>
  <div class="content">
    <div class="eyebrow">Le principe que je retiens</div>
    <h2>Une prévision jamais confrontée au réel n'est pas vraiment une prévision. C'est une estimation qu'on ne cherche pas à améliorer.</h2>
  </div>
</body>
</html>
