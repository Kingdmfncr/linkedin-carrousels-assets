<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; background: #1B2230; font-family: 'IBM Plex Sans', sans-serif; }
  .header { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: #F6F4EF; opacity: 0.6; text-transform: uppercase; }
  .counter { font-family: 'Space Grotesk', sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #2B6E71; }
  .content { position: absolute; top: 0; left: 64px; right: 64px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #2B6E71; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.3; color: #F6F4EF; margin: 0; max-width: 860px; }
  .box { background: #F6F4EF; padding: 26px 30px; margin-top: 10px; max-width: 780px; }
  .box .link { font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #2B6E71; word-break: break-word; }
</style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Gisèle Metouck</div>
    <div class="counter">5 / 5</div>
  </div>
  <div class="content">
    <div class="eyebrow">À vous de voir</div>
    <h2>Le dernier benchmark utilisé pour une décision RH ou salariale : en connaissiez-vous les limites aussi bien que le résultat ?</h2>
    <div class="box">
      <div class="link">llm-benchmark-salarial.streamlit.app</div>
    </div>
  </div>
</body>
</html>
