<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; background: #F6F4EF; font-family: 'IBM Plex Sans', sans-serif; }
  .header { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: #1B2230; opacity: 0.5; text-transform: uppercase; }
  .counter { font-family: 'Space Grotesk', sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #2B6E71; }
  .content { position: absolute; top: 0; left: 64px; right: 64px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #2B6E71; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 42px; line-height: 1.3; color: #1B2230; margin: 0; }
  p.support { font-size: 24px; line-height: 1.55; color: #1B2230; opacity: 0.82; margin: 0; max-width: 820px; }
</style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Gisèle Metouck</div>
    <div class="counter">5 / 6</div>
  </div>
  <div class="content">
    <div class="eyebrow">Ce que c'est</div>
    <h2>Projet personnel, données simulées</h2>
    <p class="support">La logique de calcul est celle que je proposerais en mission : transparente, auditable, et modifiable sans toucher au code.</p>
  </div>
</body>
</html>
