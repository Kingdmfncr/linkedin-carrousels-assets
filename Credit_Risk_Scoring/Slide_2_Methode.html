<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; background: #F6F4EF; font-family: 'IBM Plex Sans', sans-serif; }
  .header { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: #1B2230; opacity: 0.5; text-transform: uppercase; }
  .counter { font-family: 'Space Grotesk', sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #2B6E71; }
  .content { position: absolute; top: 0; left: 64px; right: 64px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #2B6E71; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.25; color: #1B2230; margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .tag { background: #1B2230; color: #F6F4EF; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; padding: 14px 20px; }
  p.support { font-size: 21px; color: #1B2230; opacity: 0.75; margin-top: 6px; max-width: 800px; }
</style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Gisèle Metouck</div>
    <div class="counter">2 / 6</div>
  </div>
  <div class="content">
    <div class="eyebrow">La méthode</div>
    <h2>Le poids exact de chaque critère, visible</h2>
    <div class="tags">
      <div class="tag">Revenu</div>
      <div class="tag">Taux d'endettement</div>
      <div class="tag">Ancienneté</div>
      <div class="tag">Historique d'incidents</div>
    </div>
    <p class="support">Pas seulement le score final : un conseiller peut expliquer une décision plutôt que la constater.</p>
  </div>
</body>
</html>
