<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; background: #F6F4EF; font-family: 'IBM Plex Sans', sans-serif; }
  .header { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.14em; color: #1B2230; opacity: 0.5; text-transform: uppercase; }
  .counter { font-family: 'Space Grotesk', sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #2B6E71; }
  .content { position: absolute; top: 0; left: 64px; right: 64px; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #2B6E71; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.3; color: #1B2230; margin: 0; }
  .stats { display: flex; gap: 24px; margin-top: 4px; }
  .stat { background: #FFFFFF; border: 1px solid rgba(27,34,48,0.12); padding: 30px 28px; flex: 1; }
  .stat .num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; color: #2B6E71; }
  .stat .label { font-size: 18px; color: #1B2230; opacity: 0.75; margin-top: 8px; }
  .segs { display: flex; gap: 12px; margin-top: 4px; }
  .seg { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; padding: 12px 16px; background: #1B2230; color: #F6F4EF; }
</style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Gisèle Metouck</div>
    <div class="counter">3 / 6</div>
  </div>
  <div class="content">
    <div class="eyebrow">Ce que ça produit</div>
    <h2>Un score explicable, pas une boîte noire</h2>
    <div class="stats">
      <div class="stat"><div class="num">100 pts</div><div class="label">score composite, 6 critères pondérés</div></div>
    </div>
    <div class="segs">
      <div class="seg">Conforme</div>
      <div class="seg">À compléter</div>
      <div class="seg">Bloquant</div>
    </div>
  </div>
</body>
</html>
